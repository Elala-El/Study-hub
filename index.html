<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Hub Pro+</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin:0;
  background: linear-gradient(135deg, #4facfe, #00f2fe);
  color:#333;
}

h1 {
  background: #222;
  color: white;
  padding: 15px;
  margin:0;
}

.container {
  margin-top: 20px;
}

.card {
  background: white;
  margin: 15px;
  padding: 20px;
  border-radius: 15px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}

button {
  padding: 12px 20px;
  margin: 10px;
  border: none;
  background: linear-gradient(45deg, #ff6a00, #ee0979);
  color: white;
  border-radius: 8px;
  cursor: pointer;
  font-size: 16px;
}

button:hover {
  opacity: 0.8;
}

.back {
  background: #444;
}

.dark {
  background: #121212;
  color: white;
}

.dark .card {
  background: #1e1e1e;
}
</style>

</head>
<body>

<h1>📚 Study Hub Pro+</h1>
<button onclick="toggleDarkMode()">🌙 Dark Mode</button>

<div class="container" id="main"></div>

<script>

const data = {
  "Class 9": {
    "Maths": {
      "Formula Sheets": "Important Maths Formulas:\n\n(a+b)² = a² + b² + 2ab\n(a-b)² = a² + b² - 2ab\na² - b² = (a-b)(a+b)"
    },
    "Science": {
      "Physics": {
        "Motion": "v = u + at, s = ut + 1/2at²",
        "Force": "F = ma"
      },
      "Biology": {
        "Cell": "Cell is basic unit of life",
        "Tissues": "Group of similar cells"
      }
    },
    "SST": {
      "History": {
        "French Revolution": "Started in 1789"
      },
      "Geography": {
        "India Size": "India is 7th largest country"
      },
      "Civics": {
        "Democracy": "People choose their government"
      },
      "Economics": {
        "Poverty": "Lack of basic needs"
      }
    },
    "IT": {
      "Part A": "Communication Skills, Self Management",
      "Part B": "Computer Basics, Digital Tools"
    }
  }
};

let historyStack = [];

function showOptions(obj, title="Select") {
  const main = document.getElementById("main");
  main.innerHTML = `<div class='card'><h2>${title}</h2></div>`;

  if (historyStack.length > 0) {
    let backBtn = document.createElement("button");
    backBtn.innerText = "⬅ Back";
    backBtn.classList.add("back");
    backBtn.onclick = () => {
      const prev = historyStack.pop();
      showOptions(prev.obj, prev.title);
    };
    main.appendChild(backBtn);
  }

  for (let key in obj) {
    let btn = document.createElement("button");
    btn.innerText = key;

    btn.onclick = () => {
      historyStack.push({ obj: obj, title: title });

      if (typeof obj[key] === "string") {
        main.innerHTML = `
          <div class='card'>
            <h2>${key}</h2>
            <p>${obj[key].replace(/\\n/g, '<br>')}</p>
            <button class="back" onclick="goBack()">⬅ Back</button>
          </div>
        `;
      } else {
        showOptions(obj[key], key);
      }
    };

    main.appendChild(btn);
  }
}

function goBack() {
  const prev = historyStack.pop();
  showOptions(prev.obj, prev.title);
}

function toggleDarkMode() {
  document.body.classList.toggle("dark");
}

// Start
showOptions(data, "Choose Class");

</script>

</body>
</html>
